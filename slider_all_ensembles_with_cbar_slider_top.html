
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zell – Only Rainfall vs Rainfall + Discharge</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    .slider-container {
      text-align: center;
      padding: 10px;
      background-color: #eeeeee;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    input[type=range] {
      width: 40%;
      height: 25px;
    }
    .wrapper {
      display: flex;
      flex-direction: row;
      height: calc(100vh - 60px);
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 20px;
      flex-grow: 1;
      overflow-y: auto;
    }
    .panel {
      width: 48%;
      min-width: 320px;
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .panel img {
      max-width: 100%;
      height: auto;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .panel h4 {
      font-size: 14px;
      margin: 5px 0 10px 0;
    }
    .side-panel {
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #eeeeee;
      padding: 10px;
    }
    .side-panel img {
      width: 80px;
      margin-top: 10px;
    }
    .step-label {
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="slider-container">
  <div>
    <span class="step-label">Step:</span>
    <span id="stepTxt">0000</span>
  </div>
  <input type="range" min="0" max="12" value="0" id="leadSlider">
</div>

<div class="wrapper">
  <div class="grid">
    <!-- LEFT: Only rainfall -->
    <div class="panel">
      <h4>Only rainfall</h4>
      <img id="img_left" src="ZELL_PLOTS/Zell_2m_Combiprecip/Zell_2m-0000_nocbar.png" alt="Only rainfall">
    </div>

    <!-- RIGHT: Rainfall + discharge -->
    <div class="panel">
      <h4>Only rainfall + Discharge</h4>
      <img id="img_right" src="ZELL_PLOTS/Zell_2m_bach_Combiprecip/Zell_2m_bach-0000_nocbar.png" alt="Rainfall + discharge">
    </div>
  </div>

  <div class="side-panel">
    <img src="water_depth_cbar_vertical.png" alt="Colorbar">
  </div>
</div>

<script>
  // Steps 0000..0012
  const steps = Array.from({length: 13}, (_, i) => String(i).padStart(4, "0"));
  const slider = document.getElementById("leadSlider");
  const stepTxt = document.getElementById("stepTxt");
  const leftImg = document.getElementById("img_left");
  const rightImg = document.getElementById("img_right");

  const leftDir = "ZELL_PLOTS/Zell_2m_Combiprecip";
  const rightDir = "ZELL_PLOTS/Zell_2m_bach_Combiprecip";
  const leftPrefix = "Zell_2m-";
  const rightPrefix = "Zell_2m_bach-";
  const suffix = "_nocbar.png";

  function setStep(i){
    i = Math.max(0, Math.min(steps.length-1, Number(i)||0));
    const s = steps[i];
    stepTxt.textContent = s;
    // Cache-bust with ?v= to avoid stale images
    leftImg.src  = `${leftDir}/${leftPrefix}${s}${suffix}?v=${s}`;
    rightImg.src = `${rightDir}/${rightPrefix}${s}${suffix}?v=${s}`;
    slider.value = i;
  }

  slider.addEventListener("input", e => setStep(e.target.value));
  // Optional: keyboard arrows
  window.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") setStep(Number(slider.value)+1);
    if (e.key === "ArrowLeft")  setStep(Number(slider.value)-1);
  });

  setStep(0);
</script>
</body>
</html>
